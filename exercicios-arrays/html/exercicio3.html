<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercício 3</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>

<body>
    <div class="card">
        <h1>Temperaturas da semana</h1>
        <ul id="lista-temperaturas">
            <li>carregando...</li>
        </ul>
    </div>

    <script>
        fetch('../php/exercicio3.php')
            .then(resposta => resposta.json())
            .then(dado => {
                const ul = document.getElementById('lista-temperaturas');
                ul.innerHTML = ''; 

                dado.temperaturas.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    ul.appendChild(li);
                });
            });
    </script>
</body>

</html>
