<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Consumo de Combustível</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>

<body>
    <div class="card">
        <h1>Consumo de Combustível</h1>

        <form id="form-combustivel">
            <label>Distância percorrida (km):</label><br>
            <input type="number" step="0.01" id="distancia" required><br><br>

            <label>Combustível gasto (litros):</label><br>
            <input type="number" step="0.01" id="combustivel" required><br><br>

            <button type="submit">Calcular</button>
        </form>

        <p id="resultado"></p>
    </div>

    <script>
        document.getElementById('form-combustivel').addEventListener('submit', function (e) {
            e.preventDefault(); // impede a página de recarregar

            const distancia = document.getElementById('distancia').value;
            const combustivel = document.getElementById('combustivel').value;

            fetch('../php/exercicio1_combustivel.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ distancia: distancia, combustivel: combustivel })
            })
                .then(resposta => resposta.json())
                .then(dado => {
                    const p = document.getElementById('resultado');
                    if (dado.erro) {
                        p.textContent = "⚠️ " + dado.mensagem;
                    } else {
                        p.textContent = "Consumo médio: " + dado.consumo + " km/l";
                    }
                });
        });
    </script>
</body>

</html>
