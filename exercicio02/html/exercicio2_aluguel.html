<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Aluguel Carro Executivo</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>

<body>
    <div class="card">
        <h1>Aluguel de Carro Executivo</h1>

        <form id="form-aluguel">
            <label>Idade:</label><br>
            <input type="number" id="idade" required><br><br>

            <label>Renda mensal (R$):</label><br>
            <input type="number" step="0.01" id="renda" required><br><br>

            <button type="submit">Verificar</button>
        </form>

        <p id="resultado"></p>
    </div>

    <script>
        document.getElementById('form-aluguel').addEventListener('submit', function (e) {
            e.preventDefault();

            const idade = document.getElementById('idade').value;
            const renda = document.getElementById('renda').value;

            fetch('../php/exercicio2_aluguel.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idade: idade, renda: renda })
            })
                .then(resposta => resposta.json())
                .then(dado => {
                    const p = document.getElementById('resultado');
                    p.textContent = dado.autorizado
                        ? "✅ Locação da categoria luxo autorizada."
                        : "❌ Locação da categoria luxo não autorizada.";
                });
        });
    </script>
</body>

</html>
